[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gravador-reuniao"
version = "1.1.0"
description = "Assistente de reunião multiplataforma (Windows + Fedora Linux) com captura de legendas, OCR, tradução e respostas Globish"
requires-python = ">=3.10"
dependencies = [
    "mss>=9.0.1",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "sentencepiece>=0.1.99",
    "openai>=1.6.0",
    "requests>=2.31.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    "python-dotenv>=1.0.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
# Áudio — comum a Windows e Linux (faster-whisper + silero-vad + numpy)
audio = [
    "faster-whisper>=1.0.0",
    "silero-vad>=4.0.0",
    "SoundFile>=0.12.0",
    "numpy>=1.24.0",
]
# Windows: PyAudio com bindings WASAPI
windows = [
    "PyAudio>=0.2.14",
]
# Linux: não exige PyAudio (usa pw-record subprocess), mas PyAudio é
# opcionalmente útil se quiser usar ALSA diretamente.
linux = []
# Dev: testes, lint, cobertura
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=7.0.0",
]
# Fidelidade de áudio: suíte de testes de qualidade de captura (offline).
# Não é dependência de runtime do produto — apenas desenvolvimento/CI.
# Nota: deps de teste duplicadas de [dev] intencionalmente (auto-referência
# de extra depende de suporte da ferramenta de instalação; duplicar é mais
# robusto e evita resolver um pacote PyPI de mesmo nome).
fidelity = [
    "pytest>=7.4.0",
    "jiwer>=3.0.0",
    "hypothesis>=6.100.0",
    "scipy>=1.11.0",
    "SoundFile>=0.12.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "jsonschema>=4.20.0",
]
# Métricas DER offline (pesado: puxa torch). Opcional e separado de
# dev/fidelity para não pesar o job padrão de PR.
"diarization-metrics" = [
    "pyannote.metrics>=0.28.0",
]
# Diarização (opcional, pesada) — requer token Hugging Face
diarization = [
    "diart>=0.7.0",
    "pyannote.audio>=3.1.0",
]

[project.scripts]
gravador-diagnose-linux = "scripts.diagnose_linux_audio:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Evita warnings de marker desconhecido: qualquer marker fora da lista acima
# é erro em vez de aviso silencioso.
addopts = "-ra --strict-markers"
markers = [
    "integration: testes de integração que exigem hardware real ou sessão gráfica",
    "requires_pipewire: testes que exigem PipeWire rodando",
    "requires_wasapi: testes que exigem Windows + WASAPI",
    "requires_display: testes que exigem sessão gráfica ativa (X11 ou Wayland)",
    "requires_x11: testes que exigem sessão X11 ativa",
    "requires_wayland: testes que exigem sessão Wayland ativa",
    "requires_stt_model: testes que exigem modelo Whisper baixado em cache",
    "requires_tesseract: testes que exigem Tesseract instalado com idioma português",
    "fidelity: testes de fidelidade de captura de áudio (integridade, contratos, metamórficos, WER/DER)",
    "golden: testes de verificação contra golden master (baseline congelada)",
    "performance: testes de budget de latência/performance (smoke ou produção)",
    "real_audio: testes que exigem caminho de áudio real (loopback/hardware), não sintético",
    "fuzz: testes de robustez com Hypothesis/entradas adversariais",
    "requires_hf_token: testes que exigem token Hugging Face (referência de ambiente, nunca ecoado)",
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E501", "W503", "E203"]
