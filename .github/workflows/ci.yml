name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      # Config de flake8 declarada em pyproject.toml [tool.flake8]
      # (max-line-length=100, extend-ignore=E501,W503,E203).
      - run: flake8 src/ --max-line-length=100 --extend-ignore=E501,W503,E203

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Run tests
        run: pytest tests/ -v --cov=src
        env:
          TESSERACT_PATH: /usr/bin/tesseract
