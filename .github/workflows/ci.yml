name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Princípio do menor privilégio: apenas leitura do repositório.
# Nenhum job de teste precisa de token de escrita.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      # Config de flake8 declarada em pyproject.toml [tool.flake8]
      # (max-line-length=100, extend-ignore=E501,W503,E203).
      - run: flake8 src/ --max-line-length=100 --extend-ignore=E501,W503,E203

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Run tests
        run: pytest tests/ -v --cov=src
        env:
          TESSERACT_PATH: /usr/bin/tesseract

  # -----------------------------------------------------------------------
  # Suíte de fidelidade de áudio (offline): sem hardware, sem token HF,
  # sem download de modelo, sem PipeWire/WASAPI. Job rápido (~1-2 min)
  # que valida integridade, contratos, metamórficos, fuzzing limitado
  # (max_examples=25), golden verify e publica o relatório JSON de
  # qualidade como artefato. Testes que exigem recursos reais fazem
  # skip EXPLÍCITO com motivo rastreável (ver relatório) — nunca
  # sucesso simulado.
  # -----------------------------------------------------------------------
  fidelity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fidelity dependencies (leves)
        run: |
          pip install pytest pytest-cov jiwer hypothesis scipy \
            soundfile numpy PyYAML jsonschema structlog python-dotenv
          # Instala o pacote sem as deps pesadas de runtime (torch,
          # transformers, customtkinter) — a suíte offline não as usa.
          pip install -e . --no-deps
      - name: Verify deterministic corpus regenerability
        run: python scripts/gen_fidelity_fixtures.py --check
      - name: Golden master verify
        run: python scripts/fidelity_golden.py verify
      - name: Run offline fidelity suite
        run: |
          pytest tests/fidelity tests/golden tests/contracts tests/performance \
            -q -p no:cacheprovider \
            --junitxml=artifacts/fidelity/junit.xml
      - name: Build consolidated quality report (JSON)
        if: always()
        run: |
          python scripts/build_fidelity_report.py \
            --output artifacts/fidelity/report.json \
            --from-junit artifacts/fidelity/junit.xml
      - name: Upload fidelity report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-fidelity-report
          path: artifacts/fidelity/
          retention-days: 30
          if-no-files-found: error
