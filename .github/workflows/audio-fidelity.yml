name: Audio Fidelity (Real/Nightly)

# Workflow OPT-IN de qualidade real: executa os testes que exigem
# recursos indisponíveis no job padrão de PR:
#   - STT real (faster-whisper base, CPU, download ~145 MB)
#   - espeak-ng (TTS determinístico para WER objetivo)
#   - pyannote.metrics (DER; instalável sem torch)
#   - diart/pyannote.audio real — SOMENTE se o secret HF_TOKEN existir
#     (referência de ambiente; o valor nunca é ecoado em logs)
#   - testes de integração PipeWire/WASAPI: em runners hospedados SEM
#     sessão de áudio, fazem SKIP EXPLÍCITO com motivo rastreável.
#
# HONESTIDADE: este workflow NÃO finge que testes de hardware rodaram.
# O relatório JSON de saída registra cada skip com motivo. Quando houver
# um runner self-hosted com PipeWire, os mesmos comandos passam a
# executar os testes reais sem mudanças neste arquivo.

on:
  workflow_dispatch:
    inputs:
      run_stt_real:
        description: "Baixar modelo whisper base e rodar WER real (CPU)"
        type: boolean
        default: true
      run_integration:
        description: "Rodar testes de integração (skips sem PipeWire)"
        type: boolean
        default: true
  schedule:
    # Noturno: 03:00 UTC (job agendado roda STT real por padrão)
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  real-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps (espeak-ng para TTS determinístico)
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Install Python dependencies
        run: |
          pip install pytest jiwer hypothesis scipy soundfile numpy \
            PyYAML jsonschema structlog python-dotenv pyannote.metrics
          pip install -e . --no-deps
      - name: Verify corpus + golden
        run: |
          python scripts/gen_fidelity_fixtures.py --check
          python scripts/fidelity_golden.py verify

      # ------------------------------------------------------------------
      # Bloco opt-in: modelo whisper base (~145 MB, CPU) para WER/CER
      # reais (STT-03) e guard-rail RUIDO-02 (xfail documentado D-009).
      # ------------------------------------------------------------------
      - name: Install faster-whisper and download base model
        if: ${{ github.event_name == 'schedule' || inputs.run_stt_real }}
        run: |
          pip install faster-whisper
          python scripts/setup_audio_models.py --whisper base
      - name: Run fidelity suite (inclui STT real quando modelo existe)
        run: |
          pytest tests/fidelity tests/golden tests/contracts tests/performance \
            -q -p no:cacheprovider -ra \
            --junitxml=artifacts/fidelity/junit.xml

      # ------------------------------------------------------------------
      # Bloco de integração com hardware/sessão real: em runners
      # hospedados os testes fazem SKIP EXPLÍCITO (sem PipeWire). Em
      # runner self-hosted com PipeWire, executam de verdade.
      # ------------------------------------------------------------------
      - name: Run integration tests (real when PipeWire present)
        if: ${{ github.event_name == 'schedule' || inputs.run_integration }}
        run: |
          pytest tests/integration -q -p no:cacheprovider -ra \
            --junitxml=artifacts/fidelity/junit-integration.xml || true
        # `|| true` NÃO é sucesso fingido: os resultados (incluindo skips
        # com motivo) entram no relatório; falhas reais de integração são
        # sinalizadas na etapa de resumo abaixo, que falha o job quando
        # houver FALHAS (não skips) — ver passo "Honest summary gate".

      # ------------------------------------------------------------------
      # Diarização real (diart/pyannote.audio): pesada (torch) e exige
      # token HF com termos aceitos. Instalação + token são OPT-IN.
      # ------------------------------------------------------------------
      - name: Run diarization real tests (requires HF_TOKEN secret)
        if: ${{ github.event_name == 'schedule' || inputs.run_stt_real }}
        env:
          # Referência de secret por ambiente — valor NUNCA ecoado.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN+x}" ] || [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN ausente: testes requires_hf_token farão skip"
            echo "explícito (com motivo) — comportamento honesto."
          fi
          pip install diart pyannote.audio || \
            echo "diart/pyannote.audio não instalável neste runner — \
                  testes farão skip explícito"
          pytest tests/fidelity -m "requires_hf_token" -q -p no:cacheprovider \
            --junitxml=artifacts/fidelity/junit-diarization.xml || true

      - name: Consolidate reports
        if: always()
        run: |
          if [ -f artifacts/fidelity/junit.xml ]; then
            python scripts/build_fidelity_report.py \
              --output artifacts/fidelity/report.json \
              --from-junit artifacts/fidelity/junit.xml
          else
            python scripts/build_fidelity_report.py \
              --output artifacts/fidelity/report.json --no-pytest
          fi

      - name: Honest summary gate (falha real, nunca skip)
        if: always()
        run: |
          python - << 'EOF'
          import json, sys
          try:
              report = json.load(open("artifacts/fidelity/report.json"))
          except FileNotFoundError:
              print("report.json ausente — ver passos anteriores")
              sys.exit(1)
          s = report["summary"]
          print(f"total={s['total']} passed={s['passed']} "
                f"failed={s['failed']} skipped={s['skipped']} "
                f"xfailed={s['xfailed']}")
          for r in report["results"]:
              if r["status"] == "skipped":
                  print(f"  SKIP: {r['test_name']}: "
                        f"{(r.get('skip_reason') or '')[:100]}")
          if s["failed"] > 0 or s.get("error", 0) > 0:
              print("FALHAS REAIS detectadas — job marcado como falho.")
              sys.exit(1)
          print("Sem falhas reais. Skips listados acima são recursos "
                "ausentes neste runner (rastreáveis no relatório).")
          EOF

      - name: Upload fidelity report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-fidelity-report-real
          path: artifacts/fidelity/
          retention-days: 30
          if-no-files-found: error
